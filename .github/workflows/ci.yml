name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/models
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x

      - name: fmt
        run: deno fmt --check log_tail.ts log_tail_test.ts

      - name: lint
        run: deno lint log_tail.ts log_tail_test.ts

      - name: check
        run: deno check log_tail.ts log_tail_test.ts

      - name: test
        run: deno test --allow-read --allow-write --allow-run=mkfifo log_tail_test.ts
